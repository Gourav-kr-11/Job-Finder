<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Job Finder - Find Jobs Near You</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Local Job Finder</h1>
    <p>Connecting people with jobs near home</p>
  </header>

  <main>
    <!-- Simple search form -->
    <section class="search-section">
      <h2>Find Jobs Near You</h2>
      <form id="searchForm">
        <div class="field">
          <label for="hometown">Hometown / City</label>
          <input type="text" id="hometown" name="hometown" placeholder="e.g. Lucknow" required />
        </div>

        <div class="field">
          <label for="radius">Radius (km)</label>
          <input type="number" id="radius" name="radius" value="20" min="1" />
        </div>

        <div class="field">
          <label for="jobType">Job Type</label>
          <select id="jobType" name="jobType">
            <option value="">Any</option>
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Internship">Internship</option>
          </select>
        </div>

        <div class="field">
          <label for="minSalary">Min Salary (₹/month)</label>
          <input type="number" id="minSalary" name="minSalary" placeholder="e.g. 15000" />
        </div>

        <button type="submit">Search Jobs</button>
      </form>
    </section>

    <!-- Results -->
    <section class="results-section">
      <h2>Job Results</h2>
      <div id="results"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
